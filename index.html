<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ashův Pokédex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --red: #e3350d;
    --red-deep: #ad2408;
    --screen: #16233d;
    --screen-deep: #0e1730;
    --cream: #f6ecd9;
    --ink: #16233d;

    --fire: #e0392f;
    --water: #3b82c4;
    --electric: #f2c94c;
    --grass: #4caf6d;
    --psychic: #a259c6;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    font-family:'Nunito', sans-serif;
    background: linear-gradient(180deg, var(--red), var(--red-deep) 70%, #7c1808);
    display:flex;
    align-items:stretch;
    justify-content:center;
    padding: 0;
    color: var(--cream);
    -webkit-tap-highlight-color: transparent;
  }

  .device{
    position:relative;
    display:flex;
    flex-direction:column;
    width:100%;
    max-width: 480px;
    min-height:100vh;
    min-height:100dvh;
    background: linear-gradient(160deg, var(--red), var(--red-deep));
    border-radius: 28px;
    padding: 18px 16px 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35), inset 0 0 0 3px rgba(255,255,255,0.15);
  }
  @media (max-width: 480px){
    .device{ border-radius:0; box-shadow: inset 0 0 0 0 transparent; }
  }

  .avatar{
    position:absolute; top:14px; right:16px; z-index:2;
    width:40px; height:40px; border-radius:50%;
    background: rgba(0,0,0,0.25);
    border:none;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.4), 0 2px 6px rgba(0,0,0,0.3);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    padding:0;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .avatar:active{ transform: scale(0.92); }
  .avatar img{ width:100%; height:100%; object-fit:cover; }
  .avatar svg{ width:24px; height:24px; }

  .lights{
    display:flex;
    align-items:center;
    gap:10px;
    padding: 4px 4px 16px;
  }
  .lens{
    width:28px; height:28px; border-radius:50%;
    background: radial-gradient(circle at 32% 28%, #cfeeff, #4fb2ea 45%, #1a5fa0 100%);
    box-shadow: 0 0 0 4px rgba(255,255,255,0.5), 0 3px 6px rgba(0,0,0,0.3);
  }
  .dot{ width:10px; height:10px; border-radius:50%; box-shadow: 0 0 0 2px rgba(255,255,255,0.4); }
  .dot.g{ background:#3ec26a; }
  .dot.y{ background:#f2c94c; }

  .screen{
    position:relative;
    flex:1;
    background: linear-gradient(180deg, var(--screen), var(--screen-deep));
    border-radius: 16px;
    padding: 20px 16px 22px;
    box-shadow: inset 0 2px 10px rgba(0,0,0,0.5), inset 0 0 0 2px rgba(0,0,0,0.25);
  }

  .unlock-anim{
    position:absolute; inset:0; z-index:20;
    display:flex; align-items:center; justify-content:center;
    background: rgba(10,14,28,0.94);
    border-radius: 16px;
    transition: opacity 0.4s ease;
  }
  .unlock-anim[hidden]{ display:none; }
  .unlock-anim .ball{
    position:relative; width:90px; height:90px;
    opacity:0; transform: scale(0.2) translateY(-160px) rotate(-30deg);
  }
  .unlock-anim.fly .ball{ animation: ballFly 0.5s cubic-bezier(.34,1.56,.64,1) forwards; }
  @keyframes ballFly{
    0%{ opacity:0; transform: scale(0.2) translateY(-160px) rotate(-30deg); }
    70%{ opacity:1; transform: scale(1.1) translateY(6px) rotate(10deg); }
    100%{ opacity:1; transform: scale(1) translateY(0) rotate(0); }
  }
  .unlock-anim.wobble .ball{ animation: ballWobble 0.6s ease-in-out; }
  @keyframes ballWobble{
    0%,100%{ transform: rotate(0); }
    20%{ transform: rotate(-14deg); }
    40%{ transform: rotate(12deg); }
    60%{ transform: rotate(-9deg); }
    80%{ transform: rotate(6deg); }
  }
  .unlock-anim.idle .ball{ animation: ballIdle 0.9s ease-in-out infinite; }
  @keyframes ballIdle{
    0%,100%{ transform: scale(1) rotate(0); }
    50%{ transform: scale(1.07) rotate(-3deg); }
  }
  .unlock-anim .ball-top, .unlock-anim .ball-bottom{
    transition: transform 0.7s cubic-bezier(.4,0,.2,1), opacity 0.7s ease;
    transform-origin: 50px 50px;
  }
  .unlock-anim .ball-band, .unlock-anim .ball-button{ transition: opacity 0.35s ease; }
  .unlock-anim.open .ball{ animation: none; }
  .unlock-anim.open .ball-top{ transform: translateY(-70px) scale(1.3) rotate(-55deg); opacity:0; }
  .unlock-anim.open .ball-bottom{ transform: translateY(70px) scale(1.3) rotate(55deg); opacity:0; }
  .unlock-anim.open .ball-band, .unlock-anim.open .ball-button{ opacity:0; }
  .unlock-anim .flash{
    position:absolute; top:50%; left:50%; width:20px; height:20px; margin:-10px 0 0 -10px;
    border-radius:50%;
    background: radial-gradient(circle, #fff 0%, rgba(255,255,255,0.8) 40%, rgba(255,255,255,0) 72%);
    opacity:0; transform:scale(0.2);
  }
  .unlock-anim.open .flash{ animation: flashBurst 0.9s ease-out 0.2s forwards; }
  @keyframes flashBurst{
    0%{ opacity:0; transform:scale(0.2); }
    30%{ opacity:1; transform:scale(4); }
    100%{ opacity:0; transform:scale(8); }
  }
  .unlock-anim.fadeout{ opacity:0; }

  header{ text-align:center; padding: 4px 4px 18px; user-select:none; }
  .eyebrow{
    letter-spacing:0.2em; text-transform:uppercase; font-size:11px;
    color: rgba(246,236,217,0.6); margin-bottom:4px;
  }
  h1{
    font-family:'Fredoka', sans-serif; font-weight:600;
    font-size: clamp(22px, 6vw, 28px); margin:0; color:#fff;
  }
  .sub{ margin-top:8px; font-size:13px; color: rgba(246,236,217,0.55); }

  .tasks{ display:flex; flex-direction:column; gap:12px; }
  .tasks[hidden], .lock[hidden]{ display:none; }

  .task{
    position:relative;
    display:flex; align-items:center; gap:14px;
    width:100%;
    background: rgba(246,236,217,0.06);
    border: 1px solid rgba(246,236,217,0.14);
    border-radius: 16px;
    padding: 12px 14px;
    cursor:pointer;
    text-align:left;
    color: var(--cream);
    font-family:'Nunito', sans-serif;
    transition: transform 0.15s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .task:active{ transform: scale(0.98); }
  .task:focus-visible{ outline: 2px solid #fff; outline-offset: 2px; }

  .task .icon-wrap{
    position:relative;
    flex-shrink:0;
    width:44px; height:44px;
    display:flex; align-items:center; justify-content:center;
  }
  .task .icon-wrap::before{
    content:"";
    position:absolute; inset:-8px;
    border-radius:50%;
    background: radial-gradient(circle, var(--accent, transparent) 0%, transparent 72%);
    opacity:0.55;
  }
  .task .icon-wrap svg{ position:relative; width:44px; height:44px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.35)); }

  .task .body{ flex:1; min-width:0; }
  .task .name{
    font-family:'Fredoka', sans-serif; font-weight:600; font-size:15px;
    color:#fff; margin-bottom:3px;
  }
  .task .status{ font-size:12px; color: rgba(246,236,217,0.6); }

  .task .charges{ display:flex; gap:4px; flex-shrink:0; }
  .task .charge{
    width:9px; height:9px; border-radius:50%;
    background: rgba(246,236,217,0.25);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.2);
    transition: background 0.2s ease;
  }

  .task.playing{
    border-color: rgba(255,255,255,0.55);
    background: rgba(246,236,217,0.12);
    animation: breathe 1.8s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ box-shadow: 0 0 0 0 rgba(255,255,255,0.0); }
    50%{ box-shadow: 0 0 0 4px rgba(255,255,255,0.08); }
  }
  .task.playing .charge.active{ animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.35; } }

  .task.charge-1 .charge:nth-child(1){ background: var(--accent, #fff); }
  .task.charge-2 .charge:nth-child(1),
  .task.charge-2 .charge:nth-child(2){ background: var(--accent, #fff); }
  .task[data-energy="fire"]{ --accent: var(--fire); }
  .task[data-energy="water"]{ --accent: var(--water); }
  .task[data-energy="electric"]{ --accent: var(--electric); }
  .task[data-energy="grass"]{ --accent: var(--grass); }
  .task[data-energy="psychic"]{ --accent: var(--psychic); }

  .task.locked{
    cursor:default;
    filter: grayscale(0.7);
    opacity:0.5;
  }
  .task.locked .status::after{ content:" · hotovo"; }

  .task.missing .status::after{ content:" · nahrávka chybí"; }

  .lock{
    display:flex; flex-direction:column; align-items:center; gap:14px;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(246,236,217,0.16);
    border-radius: 20px;
    padding: 22px 16px 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  .lock-icon{ width:110px; height:110px; }
  .lock-play{
    display:flex; align-items:center; justify-content:center; gap:8px;
    background: rgba(246,236,217,0.08);
    border: 1px solid rgba(246,236,217,0.18);
    border-radius: 999px;
    padding: 10px 22px;
    color:#fff;
    font-family:'Fredoka', sans-serif; font-weight:600; font-size:13px;
    letter-spacing: 0.05em;
    cursor:pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .lock-play svg{ width:18px; height:18px; flex-shrink:0; }
  .lock-play.playing{ border-color: rgba(255,255,255,0.5); background: rgba(246,236,217,0.14); }

  .lock-form{ display:flex; gap:8px; width:100%; }
  .lock-form input{
    flex:1; min-width:0;
    background: rgba(0,0,0,0.28);
    border: 1px solid rgba(246,236,217,0.22);
    border-radius: 12px;
    padding: 12px 14px;
    color:#fff;
    font-family:'Nunito', sans-serif;
    font-size:16px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .lock-form input::placeholder{ color: rgba(246,236,217,0.4); text-transform:none; letter-spacing:normal; }
  .lock-form input:focus{ outline:2px solid rgba(255,255,255,0.4); outline-offset:1px; }
  .lock-form button{
    background: var(--fire);
    border:none;
    border-radius:12px;
    padding: 0 18px;
    color:#fff;
    font-family:'Fredoka', sans-serif; font-weight:600; font-size:14px;
    cursor:pointer;
  }
  .lock-error{
    min-height:16px;
    font-size:12px;
    color:#ffb3a3;
    text-align:center;
  }

  .hint-btn{
    display:flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:50%;
    background: rgba(246,236,217,0.06);
    border: 1px solid rgba(246,236,217,0.16);
    cursor:pointer;
  }
  .hint-btn svg{ width:18px; height:18px; }
  .hint-btn:active{ transform: scale(0.92); }
  .hint-reveal{
    position:absolute; inset:0; z-index:15;
    display:flex; align-items:center; justify-content:center;
    background: rgba(10,14,28,0.92);
    border-radius: 16px;
    opacity:0;
    transition: opacity 0.25s ease;
  }
  .hint-reveal[hidden]{ display:none; }
  .hint-reveal.show{ opacity:1; }
  .hint-reveal svg{ width:110px; height:110px; }
  .device.shake{ animation: shake 0.45s; }
  @keyframes shake{
    0%,100%{ transform:translateX(0) rotate(0); }
    15%{ transform:translateX(-10px) rotate(-1.5deg); }
    30%{ transform:translateX(9px) rotate(1.5deg); }
    45%{ transform:translateX(-7px) rotate(-1deg); }
    60%{ transform:translateX(6px) rotate(1deg); }
    75%{ transform:translateX(-4px) rotate(-0.5deg); }
    90%{ transform:translateX(3px) rotate(0.5deg); }
  }

  footer{
    margin-top:auto;
    text-align:center; font-size:11px; color: rgba(246,236,217,0.35);
    padding: 16px 6px 2px; user-select:none;
  }

  @media (prefers-reduced-motion: reduce){
    .task.playing, .task.playing .charge.active{ animation:none !important; }
  }
</style>
</head>
<body>

<div class="device">
  <!-- Tap resets the whole site back to the lock screen. Drop a photo in and swap the svg for <img src="..." alt="">. -->
  <button class="avatar" id="avatar" aria-label="Resetovat">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M4 14c0-5 3.5-9 8-9s8 4 8 9" fill="#f6ecd9"/>
      <path d="M14 5.5c3 1 6 4 6 8.5h-4c0-3-1-6-2-8.5Z" fill="#e3350d"/>
      <path d="M3 14c0-1 .5-1.8 1.5-1.8h15c1 0 1.5.8 1.5 1.8 0 1.3-1 2.2-2.2 2.2H5.2C4 16.2 3 15.3 3 14Z" fill="#e3350d"/>
      <circle cx="10.5" cy="10.5" r="1.6" fill="#e3350d"/>
    </svg>
  </button>
  <div class="lights">
    <div class="lens"></div>
    <div class="dot g"></div>
    <div class="dot y"></div>
  </div>

  <div class="screen">
    <header id="resetZone">
      <div class="eyebrow">Ashův deník</div>
      <h1>POKÉDEX</h1>
      <div class="sub" id="headerSub">Zamčeno</div>
    </header>

    <div class="lock" id="lockScreen">
      <svg class="lock-icon" viewBox="0 0 48 48" fill="none">
        <rect x="11" y="22" width="26" height="20" rx="4" fill="#fff" opacity="0.12" stroke="#fff" stroke-opacity="0.5" stroke-width="2"/>
        <path d="M16 22v-6a8 8 0 0 1 16 0v6" stroke="#fff" stroke-opacity="0.6" stroke-width="3" fill="none" stroke-linecap="round"/>
        <circle cx="24" cy="30" r="3" fill="#fff" opacity="0.7"/>
        <path d="M24 33v4" stroke="#fff" stroke-opacity="0.7" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <div class="lock-form">
        <input type="text" id="passwordInput" placeholder="Zadej heslo" autocomplete="off" inputmode="numeric" pattern="[0-9]*">
        <button id="unlockBtn">Odemknout</button>
      </div>
      <div class="lock-error" id="lockError"></div>
      <button class="lock-play" id="introBtn">
        <svg viewBox="0 0 24 24" fill="currentColor" id="introIcon"><path d="M8 5v14l11-7-11-7Z"/></svg>
        <span>PLAY</span>
      </button>

      <button class="hint-btn" id="hintBtn" aria-label="Nápověda">
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.9v.2h5v-.2c0-.8.4-1.5 1-1.9A6 6 0 0 0 12 3Z" stroke="#fff" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="hint-reveal" id="hintReveal" hidden></div>
    </div>

    <div class="tasks" id="tasks" hidden></div>

    <div class="unlock-anim" id="unlockAnim" hidden>
      <img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExaXFkNjg3Nzd1ejllMmxxanJqajhsMDVkdnluOGNuZ3R2ZXIwanRqaiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/Gm7LdndVpiCs0/giphy.gif" style="width:100%;height:100%;object-fit:contain;">
    </div>
  </div>

  <footer>Podrž nápis „POKÉDEX" 3 vteřiny pro reset</footer>
</div>

<audio id="audio" preload="none"></audio>

<script>
// ---- icon library (original illustrations, not licensed characters) ----
// Exception: the "grass" leaf glyph is Google's Material Symbols "eco" icon
// (Apache License 2.0, https://fonts.google.com/icons), used as-is, no attribution required.
function badge(id, gradStops, highlight, iconPaths){
  return `<svg viewBox="0 0 48 48" fill="none">
    <defs><radialGradient id="${id}" cx="32%" cy="26%" r="80%">${gradStops}</radialGradient></defs>
    <circle cx="24" cy="24" r="21" fill="url(#${id})"/>
    <ellipse cx="17" cy="13" rx="8.5" ry="4.5" fill="#fff" opacity="${highlight}" transform="rotate(-30 17 13)"/>
    ${iconPaths}
    <circle cx="24" cy="24" r="20.3" fill="none" stroke="#000" stroke-opacity="0.22"/>
  </svg>`;
}

const icons = {
  fire: badge('g-fire',
    '<stop offset="0%" stop-color="#ff9a6b"/><stop offset="50%" stop-color="#e0392f"/><stop offset="100%" stop-color="#7c1810"/>',
    0.4,
    '<path d="M14 18c2 3 4 5 4 8a4 4 0 1 1-8 0c0-2.5 2-5 4-8Z" fill="#000"/><path d="M35 19c2 3 4 5 4 8a4 4 0 1 1-8 0c0-2.5 2-5 4-8Z" fill="#000"/><path d="M24 9c4 5 8 10 7 16a7 7 0 1 1-14 0c0-2.5 1-4.5 2.3-6.2-.4 2.3.3 4.2 2 4.7a2.3 2.3 0 0 0 2.9-2.7C23.5 17 21 13.5 24 9Z" fill="#000"/>'),
  water: badge('g-water',
    '<stop offset="0%" stop-color="#a9d8fb"/><stop offset="50%" stop-color="#3b82c4"/><stop offset="100%" stop-color="#123a63"/>',
    0.4,
    '<path d="M24 11c5 6.5 9.5 12.4 9.5 17a9.5 9.5 0 0 1-19 0c0-4.6 4.5-10.5 9.5-17Z" fill="#000"/><ellipse cx="20" cy="28" rx="2.2" ry="3.2" fill="#a9d8fb" opacity="0.85" transform="rotate(-20 20 28)"/>'),
  electric: badge('g-electric',
    '<stop offset="0%" stop-color="#fff3b0"/><stop offset="50%" stop-color="#f2c94c"/><stop offset="100%" stop-color="#8a6008"/>',
    0.45,
    '<path d="M26 10 14 27h7l-2 12 13-19h-7l1-10Z" fill="#000"/>'),
  grass: badge('g-grass',
    '<stop offset="0%" stop-color="#a7e6bd"/><stop offset="50%" stop-color="#4caf6d"/><stop offset="100%" stop-color="#1c4a2b"/>',
    0.4,
    '<g transform="translate(6 6) scale(1.5)"><path d="M11.25 22q-.825 0-1.662-.187t-1.713-.538q.3-3.025 1.75-5.65T13.35 11q-2.75 1.4-4.762 3.7t-2.813 5.25q-.1-.075-.187-.162L5.4 19.6q-1.175-1.175-1.787-2.625T3 13.95q0-1.7.675-3.25T5.55 7.95q2.025-2.025 5.25-2.637t9.05-.113q.45 5.975-.15 9.113t-2.6 5.137q-1.225 1.225-2.738 1.888T11.25 22" fill="#000"/><path d="M8.5 19.5C9.5 15 12 11.5 16 9" stroke="#a7e6bd" stroke-opacity="0.85" stroke-width="1.1" fill="none" stroke-linecap="round"/></g>'),
  psychic: badge('g-psychic',
    '<stop offset="0%" stop-color="#dcb3f0"/><stop offset="50%" stop-color="#a259c6"/><stop offset="100%" stop-color="#4a1a63"/>',
    0.4,
    '<path d="M10 24c3.5-7 8.5-11 14-11s10.5 4 14 11c-3.5 7-8.5 11-14 11S13.5 31 10 24Z" fill="#000"/><path d="M27 18.5a7 7 0 0 1 0 11 5.5 5.5 0 1 1 0-11Z" fill="#dcb3f0" opacity="0.85"/>'),
};

// ---- task data ----
// NOTE: "file" points to audio that doesn't exist yet — record your intro/task
// clips later, drop them in /audio with these exact names, and it just works.
// Each task can be played MAX_PLAYS times, then the button locks (dims + "hotovo").
const MAX_PLAYS = 2;

const tasks = [
  { id:'hazeni',   name:'Házení pokéballem',      energy:'fire',     file:'audio/ukol1-hazeni.mp3' },
  { id:'voda',     name:'Vodní poklad',           energy:'water',    file:'audio/ukol2-voda.mp3' },
  { id:'elektrina',name:'Elektrická past',        energy:'electric', file:'audio/ukol3-elektrina.mp3' },
  { id:'trava',    name:'Bylinkářská výprava',    energy:'grass',    file:'audio/ukol4-trava.mp3' },
  { id:'psychika', name:'Šeptaná štafeta',        energy:'psychic',  file:'audio/ukol5-psychika.mp3' },
];

// ---- lock screen ----
// Change PASSWORD to whatever the UV-revealed note says.
const PASSWORD = '5891';
const INTRO_FILE = 'audio/intro.m4a';
const UNLOCK_KEY = 'pokemonOslavaUnlocked';

const lockScreen = document.getElementById('lockScreen');
const headerSub = document.getElementById('headerSub');
const introBtn = document.getElementById('introBtn');
const introIcon = document.getElementById('introIcon');
const passwordInput = document.getElementById('passwordInput');
const unlockBtn = document.getElementById('unlockBtn');
const lockError = document.getElementById('lockError');

const ICON_PLAY_SVG = '<path d="M8 5v14l11-7-11-7Z"/>';
const ICON_PAUSE_SVG = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
let introPlaying = false;

function isUnlocked(){ return localStorage.getItem(UNLOCK_KEY) === '1'; }

function showUnlockedScreen(){
  lockScreen.hidden = true;
  tasksEl.hidden = false;
  headerSub.textContent = 'Klepni na úkol a poslouchej';
}
function showLockedScreen(){
  lockScreen.hidden = false;
  tasksEl.hidden = true;
  headerSub.textContent = 'Zamčeno';
  passwordInput.value = '';
  lockError.textContent = '';
}

introBtn.addEventListener('click', ()=>{
  if(introPlaying){ return; }
  audio.pause();
  playingId = null;
  audio.src = INTRO_FILE;
  audio.currentTime = 0;
  introPlaying = true;
  introBtn.classList.add('playing');
  introIcon.innerHTML = ICON_PAUSE_SVG;
  audio.play().catch(()=>{
    introPlaying = false;
    introBtn.classList.remove('playing');
    introIcon.innerHTML = ICON_PLAY_SVG;
  });
});

const hintBtn = document.getElementById('hintBtn');
const hintReveal = document.getElementById('hintReveal');
let hintTimer = null;
hintBtn.addEventListener('click', ()=>{
  clearTimeout(hintTimer);
  hintReveal.innerHTML = `<img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExZnZhc2dhc3YzMXM4Z3Zsa2tnNjlhNGRjZWFoZXp6MWh6emJmNmRlMiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/bkQAAeOePeK3e/giphy.gif" style="width:100%;height:100%;object-fit:contain;">`;
  hintReveal.hidden = false;
  requestAnimationFrame(()=> hintReveal.classList.add('show'));
  hintTimer = setTimeout(()=>{
    hintReveal.classList.remove('show');
    setTimeout(()=>{ hintReveal.hidden = true; }, 400);
  }, 2000);
});

const deviceEl = document.querySelector('.device');
const unlockAnim = document.getElementById('unlockAnim');

function playUnlockAnimation(done){
  unlockAnim.hidden = false;
  setTimeout(()=>{
    unlockAnim.hidden = true;
    done();
  }, 1000);
}

function tryUnlock(){
  const val = passwordInput.value.trim().toUpperCase();
  if(!val) return;
  if(val === PASSWORD.toUpperCase()){
    lockError.textContent = '';
    playUnlockAnimation(()=>{
      localStorage.setItem(UNLOCK_KEY, '1');
      showUnlockedScreen();
    });
  } else {
    lockError.textContent = 'Špatné heslo, zkus to znovu';
    if(navigator.vibrate) navigator.vibrate([80, 40, 80, 40, 120]);
    deviceEl.classList.remove('shake');
    void deviceEl.offsetWidth;
    deviceEl.classList.add('shake');
  }
}
unlockBtn.addEventListener('click', tryUnlock);
passwordInput.addEventListener('keydown', e=>{ if(e.key === 'Enter') tryUnlock(); });

// ---- persisted progress ----
const STORAGE_KEY = 'pokemonOslavaProgress';
function loadState(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveState(state){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
let state = loadState();

// ---- render ----
const tasksEl = document.getElementById('tasks');
const audio = document.getElementById('audio');
let playingId = null;

function chargesHtml(){
  let html = '';
  for(let i=0;i<MAX_PLAYS;i++) html += '<div class="charge"></div>';
  return html;
}

function statusText(t, plays){
  if(!t.file) return 'zatím bez nahrávky';
  if(plays >= MAX_PLAYS) return 'poslechnuto';
  const left = MAX_PLAYS - plays;
  return left === MAX_PLAYS ? 'klepni pro přehrání' : `zbývá ${left}× přehrání`;
}

function render(){
  tasksEl.innerHTML = '';
  tasks.forEach(t=>{
    const plays = state[t.id] || 0;
    const locked = plays >= MAX_PLAYS;
    const btn = document.createElement('button');
    btn.className = 'task charge-' + Math.min(plays, MAX_PLAYS)
      + (locked ? ' locked' : '')
      + (!t.file ? ' missing' : '')
      + (playingId === t.id ? ' playing' : '');
    btn.dataset.energy = t.energy;
    btn.id = 'task-' + t.id;
    btn.innerHTML = `
      <div class="icon-wrap">${icons[t.energy]}</div>
      <div class="body">
        <div class="name">${t.name}</div>
        <div class="status">${statusText(t, plays)}</div>
      </div>
      <div class="charges">${chargesHtml()}</div>
    `;
    btn.addEventListener('click', ()=> handleTap(t));
    tasksEl.appendChild(btn);
  });
}

function handleTap(t){
  const plays = state[t.id] || 0;
  if(plays >= MAX_PLAYS) return; // locked, ignore
  if(playingId === t.id) return; // already playing this one, ignore extra taps

  audio.pause();
  playingId = t.id;
  render();

  if(!t.file){
    // no recording yet — still consumes nothing, just gives feedback
    playingId = null;
    render();
    return;
  }

  audio.src = t.file;
  audio.currentTime = 0;
  audio.play().then(()=>{
    state[t.id] = plays + 1;
    saveState(state);
  }).catch(()=>{
    playingId = null;
    render();
  });
}

audio.addEventListener('ended', ()=>{
  if(introPlaying){
    introPlaying = false;
    introBtn.classList.remove('playing');
    introIcon.innerHTML = ICON_PLAY_SVG;
    return;
  }
  playingId = null;
  render();
});
audio.addEventListener('error', ()=>{
  if(introPlaying){
    introPlaying = false;
    introBtn.classList.remove('playing');
    introIcon.innerHTML = ICON_PLAY_SVG;
    return;
  }
  if(playingId){ playingId = null; render(); }
});

render();
isUnlocked() ? showUnlockedScreen() : showLockedScreen();

// ---- reset: hold the header 3s, or tap the avatar ----
function resetEverything(){
  state = {};
  saveState(state);
  localStorage.removeItem(UNLOCK_KEY);
  audio.pause();
  playingId = null;
  introPlaying = false;
  render();
  showLockedScreen();
}

const resetZone = document.getElementById('resetZone');
let holdTimer = null;
function startHold(){
  holdTimer = setTimeout(resetEverything, 3000);
}
function cancelHold(){ clearTimeout(holdTimer); }
resetZone.addEventListener('pointerdown', startHold);
resetZone.addEventListener('pointerup', cancelHold);
resetZone.addEventListener('pointerleave', cancelHold);

const avatarBtn = document.getElementById('avatar');
avatarBtn.addEventListener('click', resetEverything);
</script>
